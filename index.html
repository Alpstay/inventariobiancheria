<title>Inventario biancheria AlpStay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Grafica MP · AlpStay: testata centrata su velatura verde, titoli condensati maiuscoli, etichette spaziate tra filetti, spigoli vivi, verde bosco per l'azione principale. */
:root{
  --bg:#FFFFFF; --wash:#F3F7F3; --surface:#F7F9F7; --ink:#111311; --ink-2:#565A55; --ink-3:#737872;
  --line:#CDD0C8; --line-soft:#E4E6E1;
  --green:#1B4332; --green-hover:#245A43; --on-green:#FFFFFF; --link:#1B4332;
  --sel:#111311; --on-sel:#FFFFFF; --on-sel-2:#B9BEB7; --logo:#6F736E;
  --red:#A8261D; --red-bg:#FBECEA; --amber:#8A5300; --amber-bg:#FBF1DF; --ok:#1B4332; --ok-bg:#E4EEE7; --grey-bg:#F1F2EF; --band:#CFE0D4;
  --f-display:"Bebas Neue","Oswald",Impact,"Arial Narrow",sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-code:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111311; --wash:#18221B; --surface:#171A17; --ink:#EEF0EC; --ink-2:#BCC1BA; --ink-3:#959B94;
  --line:#3B3F3A; --line-soft:#262925;
  --green:#2F7552; --green-hover:#38855F; --on-green:#FFFFFF; --link:#86CFA4;
  --sel:#EEF0EC; --on-sel:#111311; --on-sel-2:#4E524D; --logo:#959B94;
  --red:#FF8F86; --red-bg:#3B1714; --amber:#F2B65C; --amber-bg:#3A2810; --ok:#86CFA4; --ok-bg:#16301F; --grey-bg:#1F221E; --band:#1E3A29;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111311; --wash:#18221B; --surface:#171A17; --ink:#EEF0EC; --ink-2:#BCC1BA; --ink-3:#959B94;
  --line:#3B3F3A; --line-soft:#262925;
  --green:#2F7552; --green-hover:#38855F; --on-green:#FFFFFF; --link:#86CFA4;
  --sel:#EEF0EC; --on-sel:#111311; --on-sel-2:#4E524D; --logo:#959B94;
  --red:#FF8F86; --red-bg:#3B1714; --amber:#F2B65C; --amber-bg:#3A2810; --ok:#86CFA4; --ok-bg:#16301F; --grey-bg:#1F221E; --band:#1E3A29;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* testata */
.testata{background:linear-gradient(180deg,var(--wash) 0,var(--bg) 320px)}
.testata .wrap{padding-block:44px 0}
h1{margin:0;text-align:center;font-family:var(--f-display);font-weight:400;font-size:clamp(52px,11vw,76px);line-height:.92;letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
h1 span{display:block}
.regola{display:flex;align-items:center;gap:20px;margin:0;font-size:13px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.regola::before,.regola::after{content:"";flex:1 1 0;height:1px;background:var(--line)}
.regola--titolo{justify-content:center;margin:30px 0 34px;text-align:center}
.regola--titolo::before,.regola--titolo::after{flex:0 1 80px}
.etichetta-campo{display:block;margin-bottom:10px;font-size:14px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.controlli{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.case{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);background:var(--bg)}
.case button{appearance:none;display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0;min-height:60px;padding:8px 12px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--ink-2);text-align:center;cursor:pointer}
.case button:last-child{border-right:0}
.case .n{font-weight:500;font-size:16px;letter-spacing:.02em}
.case .l{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.case button[aria-checked="true"]{background:var(--sel);color:var(--on-sel)}
.case button[aria-checked="true"] .l{color:var(--on-sel-2)}
#data{width:100%;height:60px;padding:0 14px;border:1px solid var(--line);border-radius:0;background:var(--bg);font-size:17px;font-variant-numeric:tabular-nums}
.schede{display:flex;justify-content:center;gap:28px;margin-top:30px;border-bottom:1px solid var(--line-soft);overflow-x:auto}
.schede button{appearance:none;padding:14px 0 12px;border:0;border-bottom:2px solid transparent;background:none;font-size:13px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;cursor:pointer}
.schede button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* contenuto */
main{padding-block:28px 8px}
.banner{margin:0 0 20px;padding:14px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:14px}
.intestazione{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px}
.intestazione > div{min-width:0}
h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);text-wrap:balance}
.sotto-titolo{margin:6px 0 0;max-width:62ch;color:var(--ink-3);font-size:15px}
.quando{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.data-lunga{margin:0;font-weight:500;font-size:15px}
.data-lunga::first-letter{text-transform:uppercase}
.piccolo{margin:6px 0 0;font-size:14px;color:var(--ink-3)}
.chip,.pill,.badge{display:inline-flex;align-items:center;gap:7px;padding:4px 9px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.chip{border:1px solid var(--line);color:var(--ink-2)}
.chip--bozza{border-color:var(--amber);background:var(--amber-bg);color:var(--amber)}
.chip--salvato{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.pill::before{content:"";width:6px;height:6px;background:currentColor}
.pill--sotto{background:var(--red-bg);color:var(--red)}
.pill--eccesso{background:var(--amber-bg);color:var(--amber)}
.pill--ok{background:var(--ok-bg);color:var(--ok)}
.pill--da-contare,.pill--senza-soglia{background:var(--grey-bg);color:var(--ink-2)}
.badge{padding:1px 6px;font-size:10.5px;border:1px solid var(--line);color:var(--ink-2)}

.callout{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 18px;margin-top:20px;padding:16px 18px;border:1px solid var(--green);background:var(--surface)}
.callout p{margin:0;max-width:62ch;font-size:15px}

.filtri{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 12px}
.filtro{display:inline-flex;align-items:baseline;gap:8px;min-height:40px;padding:8px 14px;border:1px solid var(--line);background:var(--bg);font-size:14px;cursor:pointer}
.filtro b{font-weight:700;font-variant-numeric:tabular-nums}
.filtro[data-tono="sotto"] b{color:var(--red)}
.filtro[data-tono="eccesso"] b{color:var(--amber)}
.filtro[data-tono="ok"] b{color:var(--ok)}
.filtro[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--on-sel)}
.filtro[aria-pressed="true"] b{color:inherit}
.cerca input{width:100%;height:52px;padding:0 14px;border:1px solid var(--line);border-radius:0;background:var(--bg)}

h3{display:flex;align-items:center;gap:18px;margin:34px 0 4px;font-family:var(--f-body);font-size:13px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
h3::before,h3::after{content:"";flex:1 1 0;height:1px;background:var(--line)}
.conta-cat{letter-spacing:0;font-variant-numeric:tabular-nums}

.riga{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"art art" "conta esito" "ind ind";gap:10px 14px;align-items:center;padding:16px 0 14px;border-bottom:1px solid var(--line-soft)}
.art{grid-area:art;min-width:0}
.desc{display:block;font-weight:500;font-size:17px;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:3px;font-size:13px;color:var(--ink-3)}
.codice{font-family:var(--f-code);font-size:12.5px;color:var(--ink-2);letter-spacing:.02em}
.conta{grid-area:conta;display:flex;align-items:center;gap:8px}
.qta{width:108px;height:52px;padding:0 12px;border:1px solid var(--line);border-radius:0;background:var(--bg);font-size:21px;font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.qta::placeholder{color:var(--ink-3);font-weight:400}
.qta:focus{border-color:var(--green)}
.qta[aria-invalid="true"]{border-color:var(--red)}
.unita{font-size:13px;color:var(--ink-3)}
.esito{grid-area:esito;display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.scarto{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.riga[data-stato="sotto"] .scarto{color:var(--red)}
.riga[data-stato="eccesso"] .scarto{color:var(--amber)}
.indicatore{grid-area:ind;position:relative;height:6px;background:var(--grey-bg)}
.indicatore--vuoto{background:repeating-linear-gradient(90deg,var(--line-soft) 0 6px,transparent 6px 10px)}
.banda{position:absolute;top:0;bottom:0;background:var(--band)}
.segno{position:absolute;top:-5px;width:3px;height:16px;margin-left:-1.5px;background:var(--ink)}
.segno--sotto{background:var(--red)}
.segno--eccesso{background:var(--amber)}
.segno--ok{background:var(--ok)}
@media (prefers-reduced-motion:no-preference){.segno{transition:left .2s ease}}

.riga--soglia{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"art art art" "vuoto min max" "err err err"}
.riga--soglia .art{align-self:start}
.campo-soglia{display:flex;flex-direction:column;gap:4px}
.campo-soglia--min{grid-area:min}
.campo-soglia--max{grid-area:max}
.etichetta{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.valore{min-width:80px;font-size:21px;font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.qta--soglia{width:100px}
.errore{grid-area:err;margin:0;font-size:13px;font-weight:700;color:var(--red)}

.manca{margin-top:16px}
.nota{display:flex;flex-direction:column;margin-top:30px}
.nota label,.copia-manuale label{display:block;margin-bottom:10px;font-size:14px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:0;background:var(--bg);resize:vertical}
.azioni{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:18px}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:10px 20px;border:1px solid var(--line);border-radius:0;background:var(--bg);color:var(--ink);font-weight:500;font-size:16px;cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn svg{width:20px;height:20px;flex:none}
.btn--primario{min-height:56px;padding-inline:30px;background:var(--green);border-color:var(--green);color:var(--on-green);font-size:18px}
.btn--primario:hover{background:var(--green-hover);border-color:var(--green-hover)}
.btn--scuro{background:var(--sel);border-color:var(--sel);color:var(--on-sel)}
.btn--scuro:hover{border-color:var(--sel)}
.btn--testo{min-height:40px;padding-inline:0;background:transparent;border-color:transparent;color:var(--link);text-decoration:underline;text-underline-offset:4px}
.btn--testo:hover{border-color:transparent}
.btn--link{appearance:none;padding:0;border:0;background:none;font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.btn--pericolo,.btn--testo.btn--pericolo{color:var(--red)}
.btn--pericolo-pieno{background:var(--red);border-color:var(--red);color:var(--bg)}
.conferma{margin-top:16px;padding:16px 18px;border:1px solid var(--red);background:var(--red-bg)}
.conferma p{margin:0;color:var(--ink)}
.conferma--riga{margin-top:10px;padding:12px 14px}
.conferma--riga p{font-size:14px}
.copia-manuale{display:flex;flex-direction:column;margin-top:18px}
.vuoto{padding:30px 0;color:var(--ink-2)}
.vuoto p{margin:0 0 6px}

.aggiungi{margin-top:24px;padding:20px;border:1px solid var(--line);background:var(--surface)}
.aggiungi .piccolo{max-width:70ch}
.aggiungi-testa{display:flex;justify-content:space-between;align-items:center;gap:12px}
.aggiungi-testa h3{flex:1;margin:0;color:var(--ink-2)}
.aggiungi-testa h3::before{display:none}
.griglia-modulo{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:16px}
.campo{display:flex;flex-direction:column;min-width:0}
.campo label,.case-check legend{display:block;margin-bottom:8px;font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.campo input,.campo select{width:100%;height:56px;padding:0 14px;border:1px solid var(--line);border-radius:0;background:var(--bg);font-size:16px}
#nuovo-codice{font-family:var(--f-code);text-transform:uppercase}
#nuovo-codice::placeholder{text-transform:none}
.case-check{display:flex;flex-wrap:wrap;gap:4px 22px;margin:16px 0 0;padding:0;border:0}
.case-check legend{padding:0}
.check{display:inline-flex;align-items:center;gap:10px;min-height:40px;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--green)}

.storico{list-style:none;margin:20px 0 0;padding:0}
.voce{padding:18px 0;border-bottom:1px solid var(--line-soft)}
.voce--corrente .voce-data{color:var(--link)}
.voce-testa{display:flex;justify-content:space-between;align-items:center;gap:12px}
.voce-data{margin:0;font-weight:500;font-size:17px}
.voce-data::first-letter{text-transform:uppercase}
.voce-pill{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:10px}
.contati{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.voce-meta{margin:8px 0 0;font-size:13px;color:var(--ink-3)}
.voce-nota{margin:8px 0 0;padding-left:12px;border-left:2px solid var(--line);font-size:14px;color:var(--ink-2);white-space:pre-wrap}

/* firma */
.firma{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:44px 32px}

    });
    window.addEventListener("pagehide", () => {
      if (S.modificato) salvaBozzaOra();
    });
  }
  async function avviaArchivio() {
    const claude = window.claude;
    if (!claude || typeof claude.use !== "function") {
      S.dbStato = "assente";
      renderTutto();
      return;
    }
    const [db, user, downloads] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
    S.user = user;
    S.downloads = downloads;
    if (user) {
      const [id, editor, scrittura] = await Promise.all([user.id(), user.canEdit(), user.can("data.write")]);
      S.userId = id;
      S.puoSoglie = editor;
      if (scrittura === false) S.solaLettura = true;
    }
    if (!db) {
      S.dbStato = "assente";
      renderTutto();
      return;
    }
    S.db = db;
    S.dbStato = "pronto";
    db.collection("soglie").onSnapshot(
      (snap) => {
        const nuove = { acadia: null, hartmann: null, saslong: null };
        for (const d of snap.docs) {
          const s = leggiSoglie(d.data());
          if (s && d.id === s.hotel) nuove[s.hotel] = s;
        }
        S.soglie = nuove;
        if (S.vista === "conteggio") renderConteggio();
        else if (S.vista === "soglie") renderSoglie();
        renderBarra();
      },
      () => {
        S.dbStato = "assente";
        renderTutto();
      }
    );
    db.collection("articoli").onSnapshot(
      (snap) => {
        S.aggiunti = snap.docs.map((d) => leggiArticoloAggiunto(d.id, d.data())).filter((x) => x !== null);
        if (S.daRimuovere && !S.aggiunti.some((a) => a.hotel === S.hotel && a.codice === S.daRimuovere)) S.daRimuovere = null;
        if (S.vista === "conteggio") renderConteggio();
        else if (S.vista === "soglie") renderSoglie();
        renderBarra();
        attivaFocusDopo();
      },
      () => {
        S.dbStato = "assente";
        renderTutto();
      }
    );
    db.collection("inventari").orderBy("data", "desc").limit(1e3).onSnapshot(
      (snap) => {
        S.inventari = snap.docs.map((d) => leggiInventario(d.id, d.data())).filter((x) => x !== null && x.id === `${x.hotel}_${x.data}`);
        S.inventariCaricati = true;
        if (!S.modificato) caricaDaSalvato();
        renderTutto();
      },
      () => {
        S.dbStato = "assente";
        renderTutto();
      }
    );
    renderTutto();
  }
  function costruisciSelettoreCase() {
    $("case").replaceChildren(
      ...HOTELS.map(
        (h) => el(
          "button",
          { type: "button", role: "radio", "data-hotel": h.id, "aria-checked": String(h.id === S.hotel) },
          el("span", { class: "n", text: h.breve }),
          el("span", { class: "l", text: h.localita })
        )
      )
    );
  }
  function avvia() {
    costruisciSelettoreCase();
    collegaEventi();
    caricaContesto();
    renderTutto();
    void avviaArchivio();
  }
  avvia();
})();

</script>
